# Dev VM override — снижает resource limits для VM e2-standard-4 (4 CPU / 16 GB)
# Используется только на secondlayer-dev-vm (34.116.251.221)
# Запуск: docker compose -f docker-compose.local.yml -f docker-compose.dev-vm.yml --env-file .env.local up -d
services:
  postgres-local:
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 256M

  qdrant-local:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  app-local:
    environment:
      # Прод-Qdrant (bigbox, 296M векторов) через WireGuard-туннель
      QDRANT_URL: http://10.88.0.1:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # Neo4j citation graph (bigbox) через WireGuard-туннель
      NEO4J_URI: bolt://10.88.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      # EDRSR (edrsr_documents/courts/parties) читаем с прода (readonly) через WireGuard —
      # локальная Postgres на dev VM пустая по этим таблицам. См. EDRSR_DATABASE_URL в .env.local
      EDRSR_DATABASE_URL: ${EDRSR_DATABASE_URL}
      # FTS через туннель медленнее, чем co-located prod: дефолтных 8s не хватает →
      # пустые результаты и деградация ответов чата. Даём запас.
      EDRSR_FTS_TIMEOUT_MS: "15000"
      # Контентные чтения (legislation, редакции, opendata) — тот же прод-PG read-only
      CONTENT_DATABASE_URL: ${CONTENT_DATABASE_URL:-}
      # LLM: только Bedrock (IAM-юзер bedrock-dev, invoke-only), без прямых OpenAI/Anthropic
      LLM_PROVIDER_STRATEGY: bedrock-first
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  rada-mcp-app-local:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  document-service-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  app-openreyestr-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  terminal-service-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  minio-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  lexwebapp-local:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 256M

  nginx-local:

        reservations:
          cpus: "0.05"
          memory: 64M

  grafana-local:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  postgres-hudoc-local:
